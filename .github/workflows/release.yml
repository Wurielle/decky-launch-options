name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

      actions: read
      issues: read
      packages: write
      pull-requests: read
      repository-projects: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create changelog for release
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v1
        with:
          configuration: "changelog.config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release
        uses: ncipollo/release-action@v1
        with:
          makeLatest: true
          allowUpdates: true
          body: |
            ## 🔗 Artifact link

            ```
            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decky-launch-options.zip
            ```

            ${{ steps.github_release.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
  #          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha')}}

  deploy:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

      actions: read
      issues: read
      packages: write
      pull-requests: read
      repository-projects: read
      statuses: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set release version
        id: release_version
        shell: bash
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "package_version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set package.json version
        uses: wurielle/package-version-action@v1
        with:
          version: ${{ steps.release_version.outputs.package_version }}
          targets: |
            ./package.json

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Decky CLI Build
        run: |
          mkdir $(pwd)/cli
          curl -L -o $(pwd)/cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64"
          chmod +x $(pwd)/cli/decky
          $(pwd)/cli/decky plugin build $(pwd)
          mv "out/Launch Options.zip" "out/decky-launch-options.zip"

      - name: Upload artifacts to Release
        uses: alexellis/upload-assets@0.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_paths: '["./out/*"]'

      - name: Rollback Release
        if: failure()
        uses: author/action-rollback@stable
        with:
          tag: ${{ env.RELEASE_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-with-store:
    name: Add store build to release
    needs: [deploy]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-with-store
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout store branch
        uses: actions/checkout@v4
        with:
          ref: with-store
          fetch-depth: 0
          token: ${{ secrets.ACCOUNT_TOKEN }}

      - name: Merge released main commit into store branch
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag, got $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main; then
            echo "The release tag must belong to main." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff "refs/tags/$RELEASE_TAG" \
            -m "chore: merge $RELEASE_TAG into with-store"
          git push origin HEAD:with-store

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Set store build version
        run: npm pkg set "version=${RELEASE_TAG#v}-with-store"

      - name: Decky CLI Build
        run: |
          mkdir -p cli
          curl --fail --location --retry 3 --output cli/decky \
            "https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64"
          chmod +x cli/decky
          ./cli/decky plugin build "$PWD"
          mv "out/Launch Options.zip" "out/decky-launch-options-with-store.zip"

      - name: Attach store ZIP to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            out/decky-launch-options-with-store.zip --clobber

      - name: Add both download links to release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --json body --jq '.body' > "$notes_file"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          notes_file = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          body = notes_file.read_text()
          base_url = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{os.environ['RELEASE_TAG']}"
          regular_url = f"{base_url}/decky-launch-options.zip"
          store_url = f"{base_url}/decky-launch-options-with-store.zip"
          links = "\n".join([
              "<!-- decky-download-links:start -->",
              "## 🔗 Artifact links",
              "",
              "### Regular",
              "",
              "```",
              regular_url,
              "```",
              "",
              "### With store",
              "",
              "```",
              store_url,
              "```",
              "<!-- decky-download-links:end -->",
          ])
          managed = re.compile(
              r"<!-- decky-download-links:start -->[\s\S]*?<!-- decky-download-links:end -->"
          )
          original = re.compile(
              r"^## 🔗 Artifact link\r?\n(?:\r?\n)+```\r?\n"
              + re.escape(regular_url) + r"\r?\n```",
              re.MULTILINE,
          )
          if managed.search(body):
              body = managed.sub(lambda _: links, body, count=1)
          elif original.search(body):
              body = original.sub(lambda _: links, body, count=1)
          else:
              body = f"{links}\n\n{body}"
          notes_file.write_text(body)
          PY

          gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
